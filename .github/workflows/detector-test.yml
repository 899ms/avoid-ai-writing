name: detector

on:
  push:
    paths:
      - "detector/**"
      - "scripts/**"
      - "examples/**"
      - "evals/**"
      - "package.json"
      - ".github/workflows/detector-test.yml"
      - "README.md"
      - "SKILL.md"
      - "SKILL.full.md"
      - "references/**"
      - "dist/**"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "PROOF.md"
      - 'bin/**'
      - 'action.yml'
      - '.pre-commit-hooks.yaml'
  pull_request:
    paths:
      - "detector/**"
      - "scripts/**"
      - "examples/**"
      - "evals/**"
      - "package.json"
      - ".github/workflows/detector-test.yml"
      - "README.md"
      - "SKILL.md"
      - "SKILL.full.md"
      - "references/**"
      - "dist/**"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "PROOF.md"
      - 'bin/**'
      - 'action.yml'
      - '.pre-commit-hooks.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Kept as a single job on purpose: branch protection pins required checks by
  # job name, so a second job would silently not be required until someone
  # updates the rule.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"
      - run: npm test
      # Scores this repo's own docs with this repo's own detector. A document
      # that drifts past its budget in scripts/self-scan.js fails here. PROOF.md
      # explains what the numbers mean and what they do not claim.
      - run: npm run self-scan:check
